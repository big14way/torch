# Torch executor on Phala Cloud (Intel TDX enclave via dstack).
# Paste into Phala Cloud -> Deploy -> docker-compose.yml.
#
# The executor key is GENERATED INSIDE the enclave (no key in this file).
# Set HL_PRIVATE_KEY as a Phala "Encrypted Secret" (end-to-end encrypted); it is
# referenced below. Read the CVM serial log for the executor address, then run
# `EXECUTOR_NEW=0x... npm run set:executor -w contracts` to authorize it.
services:
  executor:
    # Pinned by digest so the TDX attestation binds this exact image, not a
    # mutable tag (Phala nodes also cache :latest). This is the Aug 7 build:
    # SL/TP trigger keeper, per-fill FDC auto-attestation, revert-aware
    # receipt waits, shared nonce manager. After any intentional agent change:
    # wait for CI, fetch the new digest (anonymous GHCR token flow), update
    # this line AND the IMAGE_DIGEST env below, redeploy.
    image: ghcr.io/big14way/torch-executor@sha256:9218f1a22864dbcf24345ce1aa537728ab7f649f38d04fd3c73c5a955ba52e38
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      PORT: "3000"
      ENCLAVE_KEYGEN: "1"
      DSTACK: "1"
      # testnet: venue-listed markets (BTC, ETH, ...) route real Hyperliquid
      # testnet orders; XRP is not listed there and falls back to the FTSO
      # mark (disclosed in README and on /verify). Flipped Aug 6 after
      # Season 2 closed, per the runbook: HL_SMOKE egress check, then canary.
      EXECUTION_MODE: testnet
      RPC_URL: https://coston2.enosys.global/ext/C/rpc
      HL_API_URL: https://api.hyperliquid-testnet.xyz
      HL_PRIVATE_KEY: ${HL_PRIVATE_KEY}
      # v2-bound consumer: enables the enclave's per-fill FDC auto-attestation.
      FDC_CONSUMER: "0xf8A523571D3b6b41C5203c4D7EE32648CAfEcbff"
      # Same digest the image: line pins. The TDX report binds this compose,
      # so the status endpoint can state exactly which image is attested.
      IMAGE_DIGEST: "sha256:9218f1a22864dbcf24345ce1aa537728ab7f649f38d04fd3c73c5a955ba52e38"
